# TriChurn Phase 12 - Customer Value & Revenue Intelligence settings.
# Every number below is a CONFIGURABLE ASSUMPTION, not a measured fact about your business.
# Revenue is NOT profit. No acquisition cost, cost-to-serve or margin data exists in the Telco snapshot.

data:
  # Candidate CSV locations (first existing wins) unless TRICHURN_REVENUE_DATA_CSV is set. Relative to project root.
  candidate_paths:
    - data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
    - data/raw/Telco-Customer-Churn.csv
    - data/Telco-Customer-Churn.csv
    - data/telco_churn_live.csv
  max_file_bytes: 20000000
  max_rows: 200000
  # Optional churn-probability column. It is used for probability-weighted exposure ONLY when provenance is
  # VALIDATED_OUT_OF_SAMPLE. In-sample / unknown provenance is refused (never silently used).
  probability:
    column: null                          # e.g. churn_probability
    provenance: UNKNOWN                   # VALIDATED_OUT_OF_SAMPLE | IN_SAMPLE | UNKNOWN

quality:
  # total_charges / (monthly_charges * tenure) outside this band is FLAGGED (not removed, not corrected).
  consistency_ratio_min: 0.25
  consistency_ratio_max: 4.0

clv:
  # Forward-looking value = MonthlyCharges x assumed remaining months. The horizons are ILLUSTRATIVE defaults until a
  # business owner sets assumptions_confirmed: true, after which the scenario is labelled ESTIMATED.
  scenario:
    enabled: true
    assumptions_confirmed: false
    remaining_months_by_contract:
      Month-to-month: 6
      One year: 12
      Two year: 24
    monthly_discount_rate: 0.0
  segmentation:
    metric: observed_billing              # observed_billing | estimated_clv
    method: quantile                      # quantile | absolute
    quantiles: [0.25, 0.50, 0.90]         # Low < q1 <= Medium < q2 <= High < q3 <= Premium
    absolute_thresholds: [500.0, 2000.0, 5000.0]   # used only when method: absolute (currency units)

revenue_risk:
  # Rule-based exposure screen (PROXY). These indicators are NOT a probability and NOT a prediction.
  rule_indicators:
    month_to_month: true
    max_tenure_months: 12
    internet_without_tech_support: true
  min_indicators_to_flag: 2

cohorts:
  tenure_bucket_edges: [0, 6, 12, 24, 48]    # buckets: 0-6, 7-12, 13-24, 25-48, 49+ (months of tenure)
  lifecycle_groups:
    New: [0, 6]
    Early: [7, 24]
    Established: [25, 48]
    Loyal: [49, null]

opportunities:
  protective_services: [OnlineSecurity, OnlineBackup, DeviceProtection, TechSupport]
  streaming_services: [StreamingTV, StreamingMovies]
  contract_review_min_tenure_months: 12
  bundle_review_max_protective_services: 1

forecast:
  frequency: M
  min_periods: 24                         # distinct, contiguous monthly periods required for READY
  min_periods_for_seasonality: 36
  max_missing_period_share: 0.10
  max_rows: 50000                         # POST /forecast/validate payload cap
  backtest_holdout_periods: 6

api:
  default_page_size: 25
  max_page_size: 200
