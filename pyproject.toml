[project]
name = "trichurn"
version = "0.1.0"
description = "TriChurn - explainable customer churn & retention intelligence platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: slower tests that train on the real Telco dataset"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
